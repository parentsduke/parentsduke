// 分数相关的共用常量与函数
const PERFECT = questions.length;
const SILVER_SCORE = PERFECT - 1; // 9分：并列亚军
const BRONZE_SCORE = PERFECT - 2; // 8分：并列季军
const medalMap = {};
medalMap[PERFECT] = '🥇';
medalMap[SILVER_SCORE] = '🥈';
medalMap[BRONZE_SCORE] = '🥉';

function getTier(score){
  if(score === PERFECT) return { label: '👑最强家长', cls: 'tier-top' };
  if(score === SILVER_SCORE) return { label: '✨学神家长', cls: 'tier-genius' };
  const ratio = score / PERFECT;
  if(ratio >= 0.7) return { label: '📚学霸家长', cls: 'tier-star' };
  if(ratio >= 0.4) return { label: '🌷用心家长', cls: 'tier-caring' };

}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let personLatestGlobal = {};
let rankingGlobal = [];

function showMyScore(name){
  const myResultEl = document.getElementById('myScoreResult');
  if(rankingGlobal.length === 0){
    myResultEl.innerHTML = '<div class="my-score-empty">还没有人提交作答</div>';
    return;
  }
  let matchName = personLatestGlobal[name] ? name : null;
  if(!matchName){
    const lower = name.toLowerCase();
    matchName = Object.keys(personLatestGlobal).find(n => n.toLowerCase() === lower) || null;
  }
  if(!matchName){
    myResultEl.innerHTML = '<div class="my-score-empty">没有找到「' + escapeHtml(name) + '」的作答记录，可能还没有提交过测验</div>';
    return;
  }
  const myScore = personLatestGlobal[matchName].score;
  const medal = medalMap[myScore] || '';
  const rankPos = rankingGlobal.filter(r => r.score > myScore).length + 1;
  myResultEl.innerHTML =
    '<div class="my-score-card">' +
      '<div class="msc-name">' + (medal ? medal + ' ' : '') + escapeHtml(matchName) + '</div>' +
      '<div class="msc-score">' + myScore + ' / ' + questions.length + '</div>' +
      '<div class="lb-tier ' + getTier(myScore).cls + '">' + getTier(myScore).label + '</div>' +
      '<div class="msc-rank">当前排名第 ' + rankPos + ' 名（共 ' + rankingGlobal.length + ' 人参与）</div>' +
    '</div>';
}

function buildLetterOrder(list){
  const seen = [];
  list.forEach(m => { if(!seen.includes(m.l)) seen.push(m.l); });
  return seen;
}
let PICKER_MEMBERS = MEMBERS; // 加载完提交数据后会替换为“只含已参与家长”的列表
let LETTER_ORDER = buildLetterOrder(PICKER_MEMBERS);

function openPicker(){
  document.getElementById('pickerOverlay').classList.add('show');
  document.getElementById('pickerSearch').value = '';
  renderPickerList();
}

function closePicker(){
  document.getElementById('pickerOverlay').classList.remove('show');
}

function renderPickerList(){
  const kw = document.getElementById('pickerSearch').value.trim().toLowerCase();
  const listEl = document.getElementById('pickerList');
  const idxEl = document.getElementById('pickerIdx');
  listEl.innerHTML = '';
  idxEl.innerHTML = '';

  if(kw){
    const filtered = PICKER_MEMBERS.filter(m => m.n.toLowerCase().includes(kw));
    if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'picker-empty';
      empty.textContent = '没有找到匹配的昵称';
      listEl.appendChild(empty);
    } else {
      filtered.forEach(m => listEl.appendChild(makeItem(m.n)));
    }
    return;
  }

  let lastLetter = null;
  PICKER_MEMBERS.forEach(m => {
    if(m.l !== lastLetter){
      lastLetter = m.l;
      const label = document.createElement('div');
      label.className = 'picker-section-label';
      label.id = 'sec-' + m.l;
      label.textContent = m.l;
      listEl.appendChild(label);
    }
    listEl.appendChild(makeItem(m.n));
  });

  LETTER_ORDER.forEach(letter => {
    const span = document.createElement('span');
    span.textContent = letter;
    span.onclick = () => jumpToLetter(letter);
    idxEl.appendChild(span);
  });
}

function makeItem(name){
  const btn = document.createElement('button');
  btn.className = 'picker-item';
  btn.textContent = name;
  btn.onclick = () => pickName(name);
  return btn;
}

function jumpToLetter(letter){
  const sec = document.getElementById('sec-' + letter);
  if(sec){
    sec.scrollIntoView({block:'start'});
  }
  const bubble = document.getElementById('pickerJumpBubble');
  bubble.textContent = letter;
  bubble.classList.add('show');
  clearTimeout(window._jumpBubbleTimer);
  window._jumpBubbleTimer = setTimeout(() => bubble.classList.remove('show'), 400);
}

function pickName(name){
  document.getElementById('pickerTriggerText').textContent = name;
  document.getElementById('pickerTrigger').classList.add('picked');
  closePicker();
  showMyScore(name);
}

async function loadResults(){
  try{
    const res = await fetch(SUPABASE_URL + '/rest/v1/quiz_responses_2?select=name,answers,total,submitted_at', {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      }
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    render(rows);
  }catch(e){
    document.getElementById('loadingCard').innerHTML =
      '<div class="loading">加载失败，请稍后重试（' + e.message + '）</div>';
  }
}

function render(rows){
  document.getElementById('loadingCard').style.display = 'none';
  document.getElementById('statsSection').style.display = 'block';
  document.getElementById('answerTitle').style.display = 'block';
  document.getElementById('answerCard').style.display = 'block';

  const totalRespondents = rows.length;
  document.getElementById('totalCount').textContent = totalRespondents;

  // 每题正确人数统计 + 每人得分（用于排行榜，按昵称去重，保留最新一次提交）
  const correctCounts = new Array(questions.length).fill(0);
  let sumScorePerPerson = 0;
  const personLatest = {}; // name -> {score, submitted_at}

  rows.forEach(row => {
    let personScore = 0;
    const answers = row.answers || [];
    answers.forEach(a => {
      const qIdx = a.question - 1;
      if(qIdx >= 0 && qIdx < questions.length && a.selected === questions[qIdx].correct){
        correctCounts[qIdx]++;
        personScore++;
      }
    });
    sumScorePerPerson += personScore;

    const name = (row.name || '匿名').trim() || '匿名';
    const ts = row.submitted_at || '';
    if(!personLatest[name] || ts >= personLatest[name].submitted_at){
      personLatest[name] = { score: personScore, submitted_at: ts };
    }
  });
  personLatestGlobal = personLatest;

  // 只在昵称选择器里列出实际参与过测验的家长，减少滚动/查找成本
  const participantNames = new Set(Object.keys(personLatest));
  const filteredMembers = MEMBERS.filter(m => participantNames.has(m.n));
  const matchedSet = new Set(filteredMembers.map(m => m.n));
  const extraNames = Array.from(participantNames)
    .filter(n => !matchedSet.has(n))
    .sort((a, b) => a.localeCompare(b));
  extraNames.forEach(n => filteredMembers.push({ n, l: (n[0] || '#').toUpperCase() }));
  PICKER_MEMBERS = filteredMembers;
  LETTER_ORDER = buildLetterOrder(PICKER_MEMBERS);

  const avgScore = totalRespondents > 0 ? (sumScorePerPerson / totalRespondents).toFixed(1) : '0';
  document.getElementById('avgScore').textContent = avgScore;

  // 找正确率最高的题
  let bestIdx = 0;
  correctCounts.forEach((c, i) => { if(c > correctCounts[bestIdx]) bestIdx = i; });
  document.getElementById('bestQ').textContent = totalRespondents > 0 ? ('第' + (bestIdx+1) + '题') : '-';

  // 排行榜：按得分从高到低，取前几名（含并列）
  const lbArea = document.getElementById('leaderboardArea');
  lbArea.innerHTML = '';
  const ranking = Object.keys(personLatest)
    .map(name => ({ name, score: personLatest[name].score }))
    .sort((a, b) => b.score - a.score);
  rankingGlobal = ranking;

  if(ranking.length === 0){
    const empty = document.createElement('div');
    empty.className = 'lb-empty';
    empty.textContent = '还没有人提交作答';
    lbArea.appendChild(empty);
  } else {
    const SHOW_MIN = 10;
    // 展示前10名；若第10名之后与第10名同分，或分数达到季军门槛（8分），一并显示（避免遗漏应得奖牌的人）
    let cutoffScore = ranking[Math.min(SHOW_MIN, ranking.length) - 1].score;
    const shown = ranking.filter((r, i) => i < SHOW_MIN || r.score === cutoffScore || r.score >= BRONZE_SCORE);

    shown.forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'lb-row';

      const medal = medalMap[r.score];
      const rankNum = ranking.filter(x => x.score > r.score).length + 1;
      const rank = document.createElement('div');
      rank.className = 'lb-rank' + (medal ? ' medal' : '');
      rank.textContent = medal ? medal : rankNum;
      row.appendChild(rank);

      const name = document.createElement('div');
      name.className = 'lb-name';
      name.textContent = r.name;
      row.appendChild(name);

      const score = document.createElement('div');
      score.className = 'lb-score';
      score.textContent = r.score + ' / ' + questions.length;
      row.appendChild(score);

      const tierInfo = getTier(r.score);
      const tier = document.createElement('div');
      tier.className = 'lb-tier ' + tierInfo.cls;
      tier.textContent = tierInfo.label;
      row.appendChild(tier);

      lbArea.appendChild(row);
    });
  }

  // 画柱状图
  const chartArea = document.getElementById('chartArea');
  chartArea.innerHTML = '';
  questions.forEach((item, idx) => {
    const pct = totalRespondents > 0 ? Math.round((correctCounts[idx] / totalRespondents) * 100) : 0;
    const rowEl = document.createElement('div');
    rowEl.className = 'bar-row';

    const qLine = document.createElement('div');
    qLine.className = 'q';
    qLine.textContent = '第' + (idx+1) + '题 · ' + correctCounts[idx] + '/' + totalRespondents + ' 人答对';
    rowEl.appendChild(qLine);

    const track = document.createElement('div');
    track.className = 'bar-track';
    const fill = document.createElement('div');
    fill.className = 'bar-fill' + (pct >= 70 ? ' high' : (pct <= 30 ? ' low' : ''));
    fill.style.width = pct + '%';

    const pctLabel = document.createElement('span');
    pctLabel.textContent = pct + '%';
    if(pct >= 18){
      pctLabel.className = 'bar-pct';
    } else {
      pctLabel.className = 'bar-pct outside';
      pctLabel.style.position = 'absolute';
      pctLabel.style.left = 'calc(' + pct + '% + 4px)';
    }
    fill.appendChild(pct >= 18 ? pctLabel : document.createTextNode(''));
    track.appendChild(fill);
    if(pct < 18) track.appendChild(pctLabel);

    rowEl.appendChild(track);
    chartArea.appendChild(rowEl);
  });

  // 揭晓答案
  const answerCard = document.getElementById('answerCard');
  answerCard.innerHTML = '';
  questions.forEach((item, idx) => {
    const block = document.createElement('div');
    block.className = 'answer-block';

    const qnum = document.createElement('div');
    qnum.className = 'qnum';
    qnum.textContent = '第 ' + (idx+1) + ' 题';
    block.appendChild(qnum);

    const qtext = document.createElement('div');
    qtext.className = 'qtext';
    qtext.textContent = item.q;
    block.appendChild(qtext);

    item.options.forEach((opt, oidx) => {
      const line = document.createElement('div');
      line.className = 'opt-line' + (oidx === item.correct ? ' correct' : '');
      line.innerHTML = '<span class="check">' + (oidx === item.correct ? '✓' : '') + '</span>' + opt;
      block.appendChild(line);
    });

    const explain = document.createElement('div');
    explain.className = 'explain';
    explain.innerHTML = '<b>解析：</b>' + item.explain;
    block.appendChild(explain);

    answerCard.appendChild(block);
  });
}

loadResults();
</script>

</body>
</html>
