function rpc(fn,body){
  return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()});
}
function results(){
  bar.style.width="100%";
  card.innerHTML='<p class="sub">正在加载成绩榜…</p>';
  rpc("get_results",{}).then(function(d){
    if(!d||!d.open){card.innerHTML='<p class="q">答题尚未截止</p><p class="sub">美东时间 18:00 截止后公布成绩榜。</p>';return}
    var rows=d.rows||[];
    var rate=Q.map(function(q,k){var c=rows.filter(function(r){return r.answers[k]==q.a}).length;return rows.length?Math.round(c*100/rows.length):0});
    card.innerHTML='<p class="q">成绩榜（共 '+rows.length+' 人参加）</p><p class="sub" id="rt"></p><div id="lb"></div>';
    document.getElementById("rt").textContent="各题正确率："+rate.map(function(x,k){return "第 "+(k+1)+" 题 "+x+"%"}).join("，");
    var lb=document.getElementById("lb");
    rows.forEach(function(r,n){var p=document.createElement("p");p.className="exp";p.textContent=(n+1)+". "+r.name+" — "+r.score+" / "+Q.length;lb.appendChild(p)});
  }).catch(function(){card.innerHTML='<p class="sub">成绩榜加载失败，请稍后刷新。</p>'});
}
function gate(){
  bar.style.width="0%";
  card.innerHTML='<p class="q">答题前，先选择你的群名</p><select class="sel" id="who"></select><input class="sel hide" id="other" placeholder="请输入你的群名" maxlength="100"><button class="next" id="go">开始答题</button>';
  var sel=document.getElementById("who");
  [""].concat(N).concat(["其他（群名不在列表中）"]).forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n||"— 点击选择你的群名 —";sel.appendChild(o)});
  var oth=document.getElementById("other"),OTH="其他（群名不在列表中）";
  sel.onchange=function(){oth.classList.toggle("hide",sel.value!==OTH)};
  document.getElementById("go").onclick=function(){
    if(!sel.value){sel.style.borderColor="var(--no)";sel.focus();return}
    var nm=sel.value===OTH?oth.value.trim():sel.value;
    if(!nm){oth.style.borderColor="var(--no)";oth.focus();return}
    who=nm;show();
  };
}
function show(){
  if(Date.now()>=DEADLINE.getTime()){results();return}
  if(!who){gate();return}
  bar.style.width=(i/Q.length*100)+"%";
  if(i>=Q.length){
    bar.style.width="100%";
    card.innerHTML='<p class="sub">'+who+'，测验完成</p><div class="score">'+s+' / '+Q.length+'</div><p>'+(s==Q.length?"全对！你已经看懂这场比赛的关键细节了。":"再读一遍解析，下次一定全对。")+'</p><p class="sub" id="rec"></p><button class="next" id="again">再测一次</button>';
    var rec=document.getElementById("rec");
    if(!sent){
      sent=true;rec.textContent="正在记录成绩…";
      rpc("submit_quiz",{p_name:who,p_answers:picks}).then(function(d){
        recMsg=d.status==="ok"?"成绩已记录，18:00 截止后公布成绩榜。":d.status==="duplicate"?"这个群名已经提交过，以第一次成绩为准。":d.status==="closed"?"答题已截止，成绩未记录。":"记录失败，请联系管理员。";
        rec.textContent=recMsg;
      }).catch(function(){recMsg="网络错误，成绩未记录，请刷新页面重新答题。";sent=false;rec.textContent=recMsg});
    }else{rec.textContent="成绩只记录第一次提交。"}
    document.getElementById("again").onclick=function(){i=0;s=0;picks=[];show()};
    return;
  }
  var d=Q[i],h='<p class="q">'+d.q+'</p>';
  d.o.forEach(function(t,k){h+='<button class="opt" data-k="'+k+'">'+t+'</button>'});
  h+='<div id="fb"></div>';
  card.innerHTML=h;
  card.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}});
}
function pick(k){
  var d=Q[i],bs=card.querySelectorAll(".opt");
  bs.forEach(function(b,n){b.disabled=true;if(n==d.a)b.classList.add("ok");else if(n==k)b.classList.add("no")});

  if(k==d.a)s++;
  document.getElementById("fb").innerHTML='<div class="exp">'+(k==d.a?"答对了！":"答错了，正确答案已标出。")+d.e+'</div><button class="next" id="nx">'+(i<Q.length-1?"下一题":"查看成绩")+'</button>';
  document.getElementById("nx").onclick=function(){i++;show()};
}
