<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>FW 报名 · Duke家长各届云集</title>
<style>
  :root{
    --navy:#0b1f45; --navy-deep:#071433; --duke-blue:#00539b; --sky:#3d6fb4; --sky-soft:#e7eef8;
    --paper:#f8f9fb; --paper-warm:#fbfaf6; --ink:#1c2433; --ink-soft:#4a5568; --line:#dbe3f0; --gold:#b78d4f;
    --radius:14px; --shadow:0 8px 28px rgba(11,31,69,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink); line-height:1.6;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  }
  .bar{background:var(--duke-blue);}
  .bar-in{max-width:640px;margin:0 auto;padding:14px 20px;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block;}
  .hero{max-width:640px;margin:20px auto 0;padding:0 20px;}
  .hero img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;object-position:center;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);}
  main{max-width:640px;margin:0 auto;padding:24px 20px 60px;}
  .eyebrow{color:var(--gold);font-size:13px;font-weight:600;letter-spacing:.04em;}
  h1{font-size:22px;margin:2px 0 6px;color:var(--navy-deep);}
  .lead{color:var(--ink-soft);font-size:14.5px;margin:0 0 22px;}
  .notice{background:var(--sky-soft);border-left:4px solid var(--gold);border-radius:10px;padding:14px 16px;margin:0 0 20px;font-size:14.5px;line-height:1.8;}
  .notice b{color:var(--navy);}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;}
  .field{margin-bottom:18px;}
  .field > label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  select,input[type=text]{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px;
    font-family:inherit;color:var(--ink);background:var(--paper-warm);
  }
  select:focus,input[type=text]:focus{outline:none;border-color:var(--sky);background:#fff;}
  .radio-row{display:flex;gap:10px;}
  .radio-row label{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;
    border:1px solid var(--line);border-radius:8px;background:var(--paper-warm);cursor:pointer;font-size:15px;
  }
  .radio-row input{accent-color:var(--navy);}
  .radio-row label:has(input:checked){border-color:var(--sky);background:var(--sky-soft);color:var(--navy);font-weight:500;}
  .btn{
    width:100%;background:var(--duke-blue);color:#fff;border:none;padding:13px 18px;border-radius:8px;
    font-size:16px;font-family:inherit;font-weight:500;cursor:pointer;
  }
  .btn:hover{background:var(--sky);}
  .btn:disabled{opacity:.6;cursor:default;}
  .msg{min-height:22px;margin-top:14px;font-size:14px;color:var(--ink-soft);}
  .msg.ok{color:#1d7a46;}
  .msg.err{color:#b3261e;}
  .done{display:none;margin-top:14px;background:var(--sky-soft);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.8;}
  .done.show{display:block;}
  .btn.ghost{background:#fff;color:var(--duke-blue);border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--sky-soft);}
  .modal{position:fixed;inset:0;background:rgba(7,20,51,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal[hidden]{display:none;}
  .modal-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;width:100%;max-width:380px;}
  .modal-card h2{font-size:18px;margin:0 0 10px;color:var(--navy-deep);}
  .modal-card p{font-size:14.5px;color:var(--ink-soft);margin:0 0 12px;}
  .modal-name{background:var(--sky-soft);border-radius:10px;padding:14px 16px;font-size:20px;font-weight:700;color:var(--navy);text-align:center;margin:0 0 14px;word-break:break-all;}
  .modal-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .foot{color:var(--ink-soft);font-size:12.5px;margin-top:18px;}
  .pay{display:none;margin-top:14px;background:#fff8e6;border:1px solid #ecd9a8;border-left:4px solid var(--gold);border-radius:10px;padding:14px 16px;font-size:14.5px;line-height:1.8;}
  .pay.show{display:block;}
  .pay h3{margin:0 0 6px;font-size:15px;color:var(--navy-deep);}
  .pay .amt{font-size:22px;font-weight:700;color:var(--navy);}
  .pay .pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12.5px;margin-left:8px;vertical-align:middle;}
  .pay .pill.todo{background:#fde8e6;color:#b3261e;}
  .pay .pill.ok{background:#e3f4ea;color:#1d7a46;}
  .pay .code{display:flex;align-items:center;gap:10px;margin:8px 0;}
  .pay .code b{font-size:20px;letter-spacing:.06em;color:var(--navy);background:#fff;border:1px dashed var(--gold);border-radius:8px;padding:2px 12px;}
  .pay .code button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--duke-blue);font-family:inherit;}
  .pay .info{white-space:pre-wrap;background:#fff;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px;}
  .pay .small{font-size:12.5px;color:var(--ink-soft);}
  .pay .selfpaid{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #ecd9a8;font-size:14px;cursor:pointer;}
  .pay .selfpaid input{margin-top:3px;width:17px;height:17px;flex:none;cursor:pointer;}
  .pay .selfpaid .note{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .fee-note{font-size:13.5px;color:var(--ink-soft);line-height:1.8;margin-top:10px;}
  .fee-note b{color:var(--navy);}
  #donateOther{margin-top:8px;}
  .lookup{margin-bottom:18px;}
  .lookup .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .lookup .row .field{flex:1 1 200px;margin:0;}
  .lookup .btn2{border:1px solid var(--duke-blue);background:#fff;color:var(--duke-blue);border-radius:10px;padding:11px 18px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .lookup .btn2:hover{background:var(--sky-soft);}
</style>
</head>

// 提交前弹窗：确认所选名字正确
const cm = $('confirmModal'), cmName = $('cmName'), cmOk = $('cmOk'), cmBack = $('cmBack');
function askConfirm(name){
  return new Promise(resolve => {
    cmName.textContent = name; cm.hidden = false; cmOk.focus();
    const finish = v => {
      cm.hidden = true;
      cmOk.removeEventListener('click', onOk); cmBack.removeEventListener('click', onBack);
      cm.removeEventListener('click', onBg); document.removeEventListener('keydown', onKey);
      resolve(v);
    };
    const onOk = () => finish(true), onBack = () => finish(false);
    const onBg = e => { if(e.target === cm) finish(false); };
    const onKey = e => { if(e.key === 'Escape') finish(false); };
    cmOk.addEventListener('click', onOk); cmBack.addEventListener('click', onBack);
    cm.addEventListener('click', onBg); document.addEventListener('keydown', onKey);
  });
}

function setMsg(text, kind){ msgEl.textContent = text; msgEl.className = 'msg' + (kind ? ' ' + kind : ''); }

// ---- 缴费卡片：金额由数据库按人数计算；管理员确认收款后状态才会变成「已缴清」----
const payEl = $('pay');
const money = n => '$' + (Number(n) % 1 ? Number(n).toFixed(2) : String(Number(n)));
function payLine(parent, text, cls){ const d = document.createElement('div'); if(cls) d.className = cls; d.textContent = text; parent.appendChild(d); return d; }
function payCheckbox(parent, name, p){          // 家长自报「已付款」：只是提醒管理员核对，不等于管理员已确认收款
  const due = Number(p.due) || 0, paid = Number(p.paid) || 0;
  if(paid >= due && paid > 0) return;            // 管理员已经确认收款，不用再自报
  const label = document.createElement('label'); label.className = 'selfpaid';
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!p.self_paid;
  const span = document.createElement('span');
  span.append('✅ 我已完成转账（付款后请勾选）');
  const note = document.createElement('span'); note.className = 'note';
  const sync = () => { note.textContent = cb.checked ? '已提交，等待管理员核对到账后标记为已缴清' : ''; };
  sync(); span.appendChild(note);
  cb.addEventListener('change', async () => {
    const v = cb.checked; cb.disabled = true;
    try{
      const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/fw_mark_self_paid', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_event: EVENT_ID, p_name: name, p_value: v })
      });
      if(!r.ok) cb.checked = !v;
    }catch(e){ cb.checked = !v; }
    cb.disabled = false; sync();
  });
  label.appendChild(cb); label.appendChild(span); parent.appendChild(label);
}
async function showPayment(name){
  payEl.classList.remove('show'); payEl.textContent = '';
  try{
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/fw_get_payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_event: EVENT_ID, p_name: name })
    });
    if(!res.ok) return;                       // 缴费功能未启用或函数尚未部署：静默不显示
    const p = await res.json();
    if(!p || !p.enabled) return;
    const due = Number(p.due) || 0, paid = Number(p.paid) || 0, bal = due - paid;
    const don = Number(p.donation) || 0;
    const h = document.createElement('h3'); h.textContent = '缴费'; payEl.appendChild(h);
    if(don > 0) payLine(payEl, '活动费用 ' + money(due - don) + ' + 自愿捐款 ' + money(don), 'small');
    const a = payLine(payEl, ''); a.append('应缴金额 ');
    const amt = document.createElement('span'); amt.className = 'amt'; amt.textContent = money(due); a.appendChild(amt);
    const pill = document.createElement('span'); pill.className = 'pill ' + (bal <= 0 && paid > 0 ? 'ok' : 'todo');
    pill.textContent = bal <= 0 && paid > 0 ? '已缴清' : paid > 0 ? '部分已缴' : '待缴'; a.appendChild(pill);
    if(paid > 0 && bal > 0) payLine(payEl, '已收 ' + money(paid) + '，还需补缴 ' + money(bal));
    if(bal < 0) payLine(payEl, '已多收 ' + money(-bal) + '（人数有变），管理员会与你联系退还。', 'small');
    if(bal > 0 || paid === 0){
      const c = document.createElement('div'); c.className = 'code'; c.append('付款备注码 ');
      const b = document.createElement('b'); b.textContent = p.code; c.appendChild(b);
      const cp = document.createElement('button'); cp.type = 'button'; cp.textContent = '复制';
      cp.addEventListener('click', async () => { try{ await navigator.clipboard.writeText(p.code); cp.textContent = '已复制'; }catch(e){ cp.textContent = '请手动复制'; } });
      c.appendChild(cp); payEl.appendChild(c);
      if(p.pay_info){ const i = document.createElement('div'); i.className = 'info'; i.textContent = p.pay_info; payEl.appendChild(i); }
      payLine(payEl, '转账时请在备注里写上备注码' + (p.deadline ? '，并于 ' + p.deadline + ' 前完成' : '') + '。管理员核对到账后会标记为已缴清（不是即时的），稍后重新打开本页即可查看状态。', 'small');
    }

    payEl.classList.add('show');

// ---- 费用与自愿捐款：每人费用由数据库设置；捐款选项只在缴费启用后显示 ----
const donateField = $('donateField'), donateOther = $('donateOther'), feeNote = $('feeNote');
let feeInfo = null;
function readDonation(){                       // 返回金额；没选返回 null；「其他」输入不合法返回 NaN
  const r = document.querySelector('input[name=donate]:checked');
  if(!r) return null;
  if(r.value !== 'other') return Number(r.value);
  const v = donateOther.value.trim().replace(/^\$/, '');
  if(!/^\d{1,4}(\.\d{1,2})?$/.test(v)) return NaN;
  const n = Number(v);
  return n > 0 && n <= 1000 ? n : NaN;
}
function setDonation(v){
  const n = Number(v) || 0, std = [0, 2, 5].includes(n);
  const r = document.querySelector('input[name=donate][value="' + (std ? String(n) : 'other') + '"]'); if(r) r.checked = true;
  donateOther.value = std ? '' : String(n);
}
function updateFeeNote(){
  if(!feeInfo) return;
  const per = Number(feeInfo.per_person) || 0, wf = Number(feeInfo.watch_fee) || 0;
  const g = Number(guestsEl.value) || 0, w = document.querySelector('input[name=watch]:checked');
  const d = readDonation();
  feeNote.textContent = '';
  const line1 = document.createElement('div'); line1.append('活动费用：每人 '); const b1 = document.createElement('b'); b1.textContent = money(per); line1.appendChild(b1);
  line1.append('（人数含杜娃）' + (wf ? '；观看橄榄球另加每家庭 ' + money(wf) : '')); feeNote.appendChild(line1);
  if(g){
    const base = g * per + (w && w.value === 'yes' ? wf : 0), don = (d == null || Number.isNaN(d)) ? 0 : d;
    const line2 = document.createElement('div'); line2.append('预计应缴：'); const b2 = document.createElement('b'); b2.textContent = money(base + don); line2.appendChild(b2);
    line2.append(don ? '（活动费用 ' + money(base) + ' + 捐款 ' + money(don) + '）' : ''); feeNote.appendChild(line2);
  }
}

}

  if(r.checked && r.value === 'other') donateOther.focus(); else if(r.checked) donateOther.value = '';   // 选了固定金额就清空「其他」输入框

// 这台设备上次提交的内容，方便再次修改
try{
  const last = JSON.parse(localStorage.getItem(LAST_KEY) || 'null');
  if(last && seen.has(last.name)){
    sel.value = last.name; guestsEl.value = String(last.guests || ''); majorEl.value = last.major || ''; nametagEl.value = last.nametag || last.name;
    const r = document.querySelector('input[name=watch][value=' + (last.watch ? 'yes' : 'no') + ']'); if(r) r.checked = true;
    if(typeof last.kid === 'boolean'){ const k = document.querySelector('input[name=kid][value=' + (last.kid ? 'yes' : 'no') + ']'); if(k) k.checked = true; }
    setMsg('已载入你在这台设备上次提交的内容，修改后可重新提交。');
    if(last.donation != null) setDonation(last.donation);
    showPayment(last.name);

const lookupCard = $('lookupCard'), lookupSel = $('lookupName'), lookupBtn = $('lookupBtn'), lookupPay = $('lookupPay');

async function showPaymentInto(name, el){         // 和 showPayment 一样的查询和渲染逻辑，只是写入指定的容器
  el.classList.remove('show'); el.textContent = '';

    const due = Number(p.due) || 0, paid = Number(p.paid) || 0, bal = due - paid, don = Number(p.donation) || 0;

    const a = payLine(el, ''); a.append('应缴金额 ');
    const amt = document.createElement('span'); amt.className = 'amt'; amt.textContent = money(due); a.appendChild(amt);
    const pill = document.createElement('span'); pill.className = 'pill ' + (bal <= 0 && paid > 0 ? 'ok' : 'todo');
    pill.textContent = bal <= 0 && paid > 0 ? '已缴清' : paid > 0 ? '部分已缴' : '待缴'; a.appendChild(pill);
    if(paid > 0 && bal > 0) payLine(el, '已收 ' + money(paid) + '，还需补缴 ' + money(bal));
    if(bal < 0) payLine(el, '已多收 ' + money(-bal) + '（人数有变），管理员会与你联系退还。', 'small');
    if(bal > 0 || paid === 0){
      const c = document.createElement('div'); c.className = 'code'; c.append('付款备注码 ');
      const b = document.createElement('b'); b.textContent = p.code; c.appendChild(b);
      const cp = document.createElement('button'); cp.type = 'button'; cp.textContent = '复制';
      cp.addEventListener('click', async () => { try{ await navigator.clipboard.writeText(p.code); cp.textContent = '已复制'; }catch(e){ cp.textContent = '请手动复制'; } });
      c.appendChild(cp); el.appendChild(c);
      if(p.pay_info){ const i = document.createElement('div'); i.className = 'info'; i.textContent = p.pay_info; el.appendChild(i); }
      payLine(el, '转账时请在备注里写上备注码' + (p.deadline ? '，并于 ' + p.deadline + ' 前完成' : '') + '。管理员核对到账后会标记为已缴清（不是即时的），可以再次点「查询」查看最新状态。', 'small');
    }
    payCheckbox(el, name, p);

loadFeeInfo();

btn.addEventListener('click', async () => {
  const name = sel.value, guests = Number(guestsEl.value), major = majorEl.value.trim();
  const w = document.querySelector('input[name=watch]:checked'), k = document.querySelector('input[name=kid]:checked');
  doneEl.classList.remove('show');
  if(!name)   return setMsg('请先选择你的名字', 'err');
  if(!guests) return setMsg('请选择 FW 参加人数', 'err');
  if(!k)      return setMsg('请选择杜娃是否参加 FW', 'err');
  if(!major)  return setMsg('请填写孩子专业（未定请填「未定」）', 'err');
  if(!w)      return setMsg('请选择是否观看橄榄球比赛', 'err');
  const nametag = nametagEl.value.trim();
  if(!nametag) return setMsg('请填写胸牌姓名', 'err');
  const donation = donateField.hidden ? 0 : readDonation();
  if(donation === null) return setMsg('请选择自愿捐款金额（不捐请选 $0）', 'err');
  if(Number.isNaN(donation)) return setMsg('请输入正确的捐款金额（美元，大于 0 且不超过 1000，最多两位小数）', 'err');
  const watch = w.value === 'yes', kid = k.value === 'yes';
  if(!(await askConfirm(name))){ setMsg('请核对名字后再提交。'); return; }
  btn.disabled = true; setMsg('提交中…');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 20000);
  try{
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/fw_submit_rsvp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_event: EVENT_ID, p_name: name, p_guests: guests, p_kid: kid, p_major: major, p_watch: watch }),
      signal: ctrl.signal
    });
    if(!res.ok) throw new Error(res.status + ' ' + (await res.text()));
    let tagErr = false;
    try{
      const rt = await fetch(SUPABASE_URL + '/rest/v1/rpc/fw_set_nametag', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_event: EVENT_ID, p_name: name, p_nametag: nametag })
      });
      if(!rt.ok) tagErr = true;
    }catch(e){ tagErr = true; }
    let donErr = false;
    if(feeInfo){                               // 捐款单独保存；失败不影响已保存的报名
      try{
        const r2 = await fetch(SUPABASE_URL + '/rest/v1/rpc/fw_set_donation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
          body: JSON.stringify({ p_event: EVENT_ID, p_name: name, p_donation: donation })
        });
        if(!r2.ok) donErr = true;
      }catch(e){ donErr = true; }
    }
    try{ localStorage.setItem(LAST_KEY, JSON.stringify({ name, guests, kid, major, watch, donation, nametag })); }catch(e){}
    if(tagErr) setMsg('报名已提交，但胸牌姓名没有保存成功，请再提交一次。', 'err');
    else if(donErr) setMsg('报名已提交，但捐款金额没有保存成功，请再提交一次。', 'err');
    else setMsg('✓ 已提交，谢谢！如需修改，重新选择你的名字再提交一次即可。', 'ok');
    doneEl.textContent = '';
    [['家长', name], ['FW 参加人数', guests + ' 人'], ['杜娃是否参加', kid ? '是' : '否'], ['孩子专业', major], ['观看橄榄球比赛', watch ? '是' : '否'], ['胸牌姓名', nametag]].concat(feeInfo ? [['自愿捐款', money(donation)]] : []).forEach(([k, v]) => {
      const line = document.createElement('div'); line.textContent = k + '：' + v; doneEl.appendChild(line);
    });
    doneEl.classList.add('show');
    showPayment(name);
  }catch(e){
    console.error(e);
    setMsg(e.name === 'AbortError' ? '网络较慢，提交超时，请稍后重试。' : '提交失败，请稍后再试；如果反复失败，请联系管理员。', 'err');
  }finally{ clearTimeout(timer); btn.disabled = false; }
});
</script>
</body>
</html>
